name: Export Repository Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    name: Build Git bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create repository bundle
        run: git bundle create modulah.github.io.bundle --all

      - name: Upload repository bundle
        uses: actions/upload-artifact@v7
        with:
          name: modulah-github-io-bundle
          path: modulah.github.io.bundle
          retention-days: 1
