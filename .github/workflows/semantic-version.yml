name: Semantic Versioning & Changelog

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-version:
    name: Semantic Version & Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check if PAT_TOKEN exists
        id: check_token
        run: |
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "PAT_TOKEN secret not found. Skipping semantic-release."
          fi

      - name: Install semantic-release and plugins
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits

      - name: Create .releaserc configuration
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main", "master"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              [
                "@semantic-release/changelog",
                {
                  "changelogFile": "CHANGELOG.md"
                }
              ],
              [
                "@semantic-release/git",
                {
                  "assets": ["CHANGELOG.md", "package.json"],
                  "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                }
              ],
              [
                "@semantic-release/github",
                {
                  "assets": "CHANGELOG.md"
                }
              ]
            ],
            "preset": "conventionalcommits",
            "presetConfig": {
              "types": [
                { "type": "feat", "section": "Features" },
                { "type": "fix", "section": "Bug Fixes" },
                { "type": "perf", "section": "Performance Improvements" },
                { "type": "refactor", "section": "Refactoring" },
                { "type": "docs", "section": "Documentation" },
                { "type": "style", "section": "Styles" },
                { "type": "chore", "section": "Chores" },
                { "type": "test", "section": "Tests" }
              ]
            }
          }
          EOF

      - name: Run semantic-release
        if: steps.check_token.outputs.has_token == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: npx semantic-release
