name: Apply registry hotfix refinement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify the refinement script parses
        run: python3 -m py_compile tools/refine-registry-hotfix.py

      - name: Apply shader stacking and terminal ownership refinements
        run: python3 tools/refine-registry-hotfix.py

      - name: Extract and syntax-check every inline JavaScript block
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('code.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit('No inline scripts were found in code.html.')
          for index, script in enumerate(scripts):
              Path(f'/tmp/refined-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline scripts.')
          PY
          for file in /tmp/refined-inline-*.js; do
            node --check "$file"
          done

      - name: Verify root fallback, shader stacking and terminal ownership
        run: |
          grep -q 'style="background:#111416;"' code.html
          grep -q 'z-index: 0;' code.html
          grep -q '<div class="shader-background"' code.html
          grep -q 'runRegistryTerminalSequence' code.html
          if grep -Fq 'shader-background z-[-1]' code.html; then
            echo 'The shader is still negative-stacked behind the opaque body.' >&2
            exit 1
          fi
          if grep -Fq '<div class="opacity-70 typing-line" style="animation-duration: 0.3s;">&gt; INITIALISING MODUL SYSTEMS...' code.html; then
            echo 'Hardcoded boot lines still exist in the initial terminal markup.' >&2
            exit 1
          fi

      - name: Delete the temporary refinement script and workflow
        run: |
          rm tools/refine-registry-hotfix.py
          rm .github/workflows/apply-registry-refinement.yml

      - name: Commit only the refined production HTML and helper deletions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code.html tools/refine-registry-hotfix.py .github/workflows/apply-registry-refinement.yml
          git commit -m 'Refine shader stacking and terminal startup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}