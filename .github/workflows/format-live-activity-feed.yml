name: Format live repository activity feed

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the activity-feed branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install the locked formatting toolchain
        run: npm ci

      - name: Format only the new runtime feed and its test
        run: npx prettier --write assets/js/repository-activity.js tests/repository-activity.test.js

      - name: Validate syntax and focused test
        run: |
          node --check assets/js/repository-activity.js
          npx jest tests/repository-activity.test.js --runInBand

      - name: Delete this one-use formatting workflow
        run: rm .github/workflows/format-live-activity-feed.yml

      - name: Commit the formatted production sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/repository-activity.js tests/repository-activity.test.js .github/workflows/format-live-activity-feed.yml
          git commit -m 'Format live repository activity sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}