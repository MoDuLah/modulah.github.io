name: Publish issue 14 branch patch

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'fix/issue-14-real-module-details'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/issue-14-real-module-details

      - name: Apply validated patch
        run: |
          cat .github/issue14-exact/part-00.b64 .github/issue14-exact/part-01.b64 .github/issue14-exact/part-02.b64 .github/issue14-exact/part-03.b64 .github/issue14-exact/part-04.b64 > /tmp/issue14.patch.gz.b64
          echo "add270510813507a1441cd7bd85083c2d98adfc7917c656838a1794d22282d18  /tmp/issue14.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/issue14.patch.gz.b64 | gzip -d > /tmp/issue14.patch
          echo "bd53f6e9ff59faa8e8010a7a02cd7a29a082c761e6985a7ca4b629b06ca88696  /tmp/issue14.patch" | sha256sum -c -
          git apply --check /tmp/issue14.patch
          git apply /tmp/issue14.patch
          git diff --check

      - name: Commit to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code.html
          git commit -m "Drive module details from real project data"
          git push origin HEAD:fix/issue-14-real-module-details
