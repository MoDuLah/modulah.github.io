name: Clean issue 14 branch helpers

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.ref == 'fix/issue-14-real-module-details'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/issue-14-real-module-details

      - name: Remove temporary publication files
        run: |
          rm -rf .github/issue14-exact .github/issue14-patch
          rm -f .github/workflows/apply-issue-14.yml
          rm -f .github/workflows/run-issue-14-on-push.yml
          rm -f issue14-trigger*.tmp
          git diff --check

      - name: Commit clean branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary issue 14 publication helpers"
          git push origin HEAD:fix/issue-14-real-module-details
