name: Publish issue 14 branch patch

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'fix/issue-14-real-module-details'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/issue-14-real-module-details

      - name: Apply validated patch
        run: |
          cat .github/issue14-patch/chunk-00.b64 .github/issue14-patch/chunk-01.b64 > /tmp/issue14.patch.gz.b64
          echo "d5d3d238abf909cfd6f77d4f7402d325dfd4e63fd05ea26911f9897554fc845b  /tmp/issue14.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/issue14.patch.gz.b64 | gzip -d > /tmp/issue14.patch
          echo "c45c09743c4dd6c102de72d534fc4a0abfb202221ce1785c7ec9dcc8c50b9871  /tmp/issue14.patch" | sha256sum -c -
          git apply --check /tmp/issue14.patch
          git apply /tmp/issue14.patch
          git diff --check

      - name: Commit to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code.html
          git commit -m "Drive module details from real project data"
          git push origin HEAD:fix/issue-14-real-module-details
