name: Apply staged page boot controller

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: staged-page-boot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout only the pull request branch tip
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Correct applicator replacement boundaries
        run: python3 tools/prepare-staged-applicator.py

      - name: Verify all applicator scripts parse
        run: |
          python3 -m py_compile tools/prepare-staged-applicator.py
          python3 -m py_compile tools/apply-staged-boot.py
          python3 -m py_compile tools/refine-staged-boot.py

      - name: Apply staged page boot and module diagnostics
        run: python3 tools/apply-staged-boot.py

      - name: Apply readiness and accessibility refinements
        run: python3 tools/refine-staged-boot.py

      - name: Extract and syntax-check every inline JavaScript block
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('code.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit('No inline scripts were found in code.html.')
          for index, script in enumerate(scripts):
              Path(f'/tmp/staged-boot-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline scripts.')
          PY
          for file in /tmp/staged-boot-inline-*.js; do
            node --check "$file"
          done

      - name: Verify staged boot and diagnostic behavior markers
        run: |
          grep -q 'data-boot-stage="interface"' code.html
          grep -q 'data-boot-stage="diagnostics"' code.html
          grep -q 'data-boot-section="activity"' code.html
          grep -q 'data-boot-stage="registry"' code.html
          grep -q 'data-boot-stage="footer"' code.html
          grep -q 'COMMAND CENTRE READY' code.html
          grep -q 'MOUNTING DETAIL INTERFACE' code.html
          grep -q 'REMOUNTING MODULE REGISTRY' code.html
          grep -q 'CAPABILITY 01' code.html
          grep -q 'role="log"' code.html
          test "$(grep -c 'function createModuleCard' code.html)" -eq 1
          test "$(grep -c 'function createDetailAction' code.html)" -eq 1
          test "$(grep -c 'function activateScript' code.html)" -eq 1
          test "$(grep -c 'function unloadActiveModule' code.html)" -eq 1
          if grep -q 'unloadTimer = setTimeout' code.html; then
            echo 'The old delayed unload implementation is still present.' >&2
            exit 1
          fi

      - name: Delete the three applicators and this one-use workflow
        run: |
          rm tools/prepare-staged-applicator.py
          rm tools/apply-staged-boot.py
          rm tools/refine-staged-boot.py
          rm .github/workflows/apply-staged-boot.yml

      - name: Commit only the production page change and helper deletions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code.html tools/prepare-staged-applicator.py tools/apply-staged-boot.py tools/refine-staged-boot.py .github/workflows/apply-staged-boot.yml
          git commit -m 'Implement staged boot and module diagnostics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}