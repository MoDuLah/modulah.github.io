name: Fix fresh repository activity cache

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  fix-cache:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install the locked validation toolchain
        run: npm ci

      - name: Stop network refresh when the five-minute cache is fresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/repository-activity.js')
          source = path.read_text(encoding='utf-8')
          old = '''      renderFeed(
                feed,
                cached.branch || fallbackBranch,
                cached.commits,
                isFresh ? "CACHED" : "STALE CACHE"
              );
            }

            feed.setAttribute("aria-busy", "true");'''
          new = '''      renderFeed(
                feed,
                cached.branch || fallbackBranch,
                cached.commits,
                isFresh ? "CACHED" : "STALE CACHE"
              );
              if (isFresh) {
                feed.setAttribute("aria-busy", "false");
                return;
              }
            }

            feed.setAttribute("aria-busy", "true");'''

          if source.count(old) != 1:
              raise SystemExit(f'Expected one fresh-cache block; found {source.count(old)}.')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and validate the patched runtime
        run: |
          npx prettier --write assets/js/repository-activity.js
          node --check assets/js/repository-activity.js
          npx jest tests/repository-activity.test.js --runInBand
          grep -q 'if (isFresh)' assets/js/repository-activity.js

      - name: Delete this one-use workflow
        run: rm .github/workflows/fix-live-activity-cache.yml

      - name: Commit the cache behavior correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/repository-activity.js .github/workflows/fix-live-activity-cache.yml
          git commit -m 'Skip GitHub refresh for fresh activity cache'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}