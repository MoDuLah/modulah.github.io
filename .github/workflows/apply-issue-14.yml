name: Apply issue 14 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    name: Apply real module detail data
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/issue-14-real-module-details

      - name: Apply validated code.html patch
        run: |
          cat > /tmp/issue14.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/issue14.patch.gz.b64 | gzip -d > /tmp/issue14.patch
          git apply --check /tmp/issue14.patch
          git apply /tmp/issue14.patch
          git diff --check

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code.html
          git commit -m "Drive module details from real project data"
          git push origin HEAD:fix/issue-14-real-module-details
