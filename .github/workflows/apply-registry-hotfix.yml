name: Apply focused registry hotfix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify the Python applicator parses
        run: python3 -m py_compile tools/apply-registry-hotfix.py

      - name: Apply the dark-frame and sequential-console changes
        run: python3 tools/apply-registry-hotfix.py

      - name: Extract and syntax-check every inline JavaScript block
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('code.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit('No inline scripts were found in code.html.')
          for index, script in enumerate(scripts):
              Path(f'/tmp/code-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline scripts.')
          PY
          for file in /tmp/code-inline-*.js; do
            node --check "$file"
          done

      - name: Verify the intended code markers
        run: |
          grep -q 'background-color: #111416' code.html
          grep -q 'shader-background' code.html
          grep -q "canvas.getContext('webgl', { alpha: false })" code.html
          grep -q 'runRegistryTerminalSequence' code.html
          grep -q 'cancelTerminalSequence' code.html
          if grep -Fq '`${animationDelay}ms`' code.html; then
            echo 'Legacy per-line CSS delay remains in code.html.' >&2
            exit 1
          fi
          if grep -Fq '`${filteredScripts.length * 60 + 100}ms`' code.html; then
            echo 'Legacy MODULES LOADED CSS delay remains in code.html.' >&2
            exit 1
          fi

      - name: Delete all temporary applicators and this temporary workflow
        run: |
          rm tools/apply-registry-hotfix.mjs
          rm tools/apply-registry-hotfix.py
          rm .github/workflows/apply-registry-hotfix.yml

      - name: Commit only the production HTML change and helper deletions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code.html tools/apply-registry-hotfix.mjs tools/apply-registry-hotfix.py .github/workflows/apply-registry-hotfix.yml
          git commit -m 'Fix white frames and registry console sequencing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}