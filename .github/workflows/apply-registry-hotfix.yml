name: Apply focused registry hotfix

on:
  push:
    branches:
      - agent/fix-white-frame-console-sequencing

permissions:
  contents: write

jobs:
  apply:
    # Ignore the cleanup commit produced by this workflow itself.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply hotfix
        run: node tools/apply-registry-hotfix.mjs

      - name: Validate generated page
        run: |
          node --check tools/apply-registry-hotfix.mjs
          grep -q 'runRegistryTerminalSequence' code.html
          grep -q 'background-color: #111416' code.html
          if grep -q '\`${animationDelay}ms\`' code.html; then
            echo 'Legacy delayed terminal animation is still present.' >&2
            exit 1
          fi

      - name: Remove temporary applicator and workflow
        run: |
          rm tools/apply-registry-hotfix.mjs
          rm .github/workflows/apply-registry-hotfix.yml

      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code.html tools/apply-registry-hotfix.mjs .github/workflows/apply-registry-hotfix.yml
          git commit -m 'Fix white frames and registry console sequencing'
          git push origin HEAD