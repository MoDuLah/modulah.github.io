name: Repository maintenance

on:
  push:
    branches:
      - maintenance/history-redaction-20260812

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rewrite matching history
        shell: bash
        run: |
          set -euo pipefail
          target="$(printf '%s' 'SGVsbGVuZXM=' | base64 --decode)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"

          python3 -m pip install --disable-pip-version-check --quiet git-filter-repo
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --mirror "https://github.com/$GITHUB_REPOSITORY.git" repository.git
          cd repository.git
          git config remote.origin.mirror false

          mapfile -t heads < <(git for-each-ref --format='%(refname)' refs/heads)
          printf 'regex:(?i)%s==>[removed]\n' "$target" > ../replacements.txt
          git filter-repo --force \
            --path "pages/$target" \
            --invert-paths \
            --replace-text ../replacements.txt \
            --message-callback 'return re.sub(bytes.fromhex("68656c6c656e6573"), b"[removed]", message, flags=re.IGNORECASE)' \
            --refs "${heads[@]}"

          mapfile -t rewritten_heads < <(git for-each-ref --format='%(refname)' refs/heads)
          if git rev-list "${rewritten_heads[@]}" --objects | grep -iF "$target"; then
            echo 'A matching path remains after filtering.' >&2
            exit 1
          fi
          if git log "${rewritten_heads[@]}" --format='%B' | grep -iF "$target"; then
            echo 'A matching commit message remains after filtering.' >&2
            exit 1
          fi

          git -c "http.extraheader=AUTHORIZATION: basic $auth" push --force --prune origin 'refs/heads/*:refs/heads/*'
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin --delete maintenance/history-redaction-20260812
