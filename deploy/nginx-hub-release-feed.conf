# Included inside the hub's existing server block.
# Stored outside versioned site releases so mirroring cannot replace live history.
location = /assets/data/script-updates.json {
    alias /var/www/moduls-hub/live-data/script-updates.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://modulah.github.io" always;
    add_header Cache-Control "no-store" always;
}
